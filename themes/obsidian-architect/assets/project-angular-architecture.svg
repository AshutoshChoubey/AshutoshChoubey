<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t">
  <title id="p1-t">Angular Architecture Study: Signals, HTTP Interceptors &amp; Enterprise Architecture.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>
    <g class="p1-in p1-d1">
      <text class="p1-sans" x="56" y="62" font-size="12" font-weight="600" letter-spacing="1" fill="#E5B5C7">01 · Architecture · Angular · Signals</text>
      <text class="p1-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Angular Architecture Study</text>
      <text class="p1-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Signals, HTTP interceptors, caching, and enterprise application architecture.</text>
      <text class="p1-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">Built ›</tspan> Signals interop, auth interceptors &amp; modular app.config</text>
      <line class="p1-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">Signals</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">dynamic reactive graph</text></g>
      <g transform="translate(261 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">Auth</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">token pipeline interceptor</text></g>
      <g transform="translate(466 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">Enterprise</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">modular application config</text></g>
      <g class="p1-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="112" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="112" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Angular</text></g>
      <g class="p1-chip" style="animation-delay:1.12s"><rect x="176" y="314" width="92" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="222" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">TypeScript</text></g>
      <g class="p1-chip" style="animation-delay:1.24s"><rect x="276" y="314" width="102" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="327" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">RxJS Interop</text></g>
      <g class="p1-chip" style="animation-delay:1.36s"><rect x="386" y="314" width="126" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="449" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">HTTP Interceptors</text></g>
      <g class="p1-chip" style="animation-delay:1.48s"><rect x="520" y="314" width="118" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="579" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">App Config</text></g>
    </g>
    <g class="p1-in p1-d2"><g transform="translate(0 35)">
      <g transform="translate(740 40)">
        <text class="p1-sans" x="14" y="16" font-size="11" font-weight="600" letter-spacing="0.8" fill="#B6A3AC">Reactive Signal Dependency Graph</text>
        <!-- Signal Node 1 -->
        <g transform="translate(20 44)">
          <rect width="170" height="52" rx="10" fill="#27101C" stroke="#C77B9B" stroke-opacity=".4"/>
          <text class="p1-mono" x="14" y="22" font-size="11" fill="#F8F0F3">signal(state)</text>
          <text class="p1-mono" x="14" y="38" font-size="9.5" fill="#E5B5C7">producer · source</text>
        </g>
        <!-- Connecting Line -->
        <path d="M190 70 C 230 70, 230 130, 270 130" fill="none" stroke="#E5B5C7" stroke-width="1.5"/>
        <circle r="3.5" fill="#F8F0F3" filter="url(#p1-glowf)">
          <animateMotion dur="3s" repeatCount="indefinite" path="M190 70 C 230 70, 230 130, 270 130" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/>
        </circle>
        <!-- Computed Node -->
        <g transform="translate(270 104)">
          <rect width="180" height="52" rx="10" fill="#451126" stroke="#E5B5C7" stroke-opacity=".7"/>
          <text class="p1-mono" x="14" y="22" font-size="11" fill="#F8F0F3">computed(derived)</text>
          <text class="p1-mono" x="14" y="38" font-size="9.5" fill="#F8F0F3">memoized · reactive</text>
        </g>
        <!-- Interceptor Node -->
        <g transform="translate(20 160)">
          <rect width="190" height="52" rx="10" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/>
          <text class="p1-mono" x="14" y="22" font-size="11" fill="#F8F0F3">HttpInterceptorFn</text>
          <text class="p1-mono" x="14" y="38" font-size="9.5" fill="#B6A3AC">authToken &amp; cache</text>
        </g>
        <!-- Line to RxJS Interop -->
        <path d="M210 186 C 240 186, 240 145, 270 140" fill="none" stroke="#C77B9B" stroke-opacity=".5" stroke-dasharray="4 4"/>
        <!-- Live Interop Indicator Box -->
        <g transform="translate(160 228)">
          <rect width="240" height="32" rx="8" fill="#10070C" stroke="#C77B9B" stroke-opacity=".3"/>
          <text class="p1-mono" x="120" y="20" text-anchor="middle" font-size="10.5" fill="#E5B5C7">toSignal() &amp; toObservable() Interop</text>
        </g>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p1-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p1-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>