<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">TypeScript Type-System: Advanced Generics, Unions &amp; Mapped Types.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p4-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-chip { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-trace { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">04 · TYPE SYSTEM · TYPESCRIPT · COMPILER</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">TypeScript Type-System</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Focused implementations of generics, unions, mapped types and utility types.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Comprehensive type-system reference with conditional types &amp; mapped inference</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Generics</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">constrained parameters</text></g>
      <g transform="translate(261 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Unions</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">discriminated matching</text></g>
      <g transform="translate(466 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Mapped</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">key remapping &amp; inference</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="112" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="112" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">TypeScript 5+</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="176" y="314" width="86" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="219" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Generics</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="270" y="314" width="136" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="338" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Conditional Types</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="414" y="314" width="114" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="471" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Mapped Types</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="536" y="314" width="106" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="589" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Compiler AST</text></g>
    </g>
    <g class="p4-in p4-d2"><g transform="translate(0 35)">
      <g transform="translate(750 40)">
        <text class="p4-mono" x="14" y="16" font-size="11" letter-spacing="2" fill="#B6A3AC">TYPE-LEVEL COMPUTATION &amp; INFERENCE</text>
        <!-- Layer 1: Conditional inference -->
        <g transform="translate(20 44)">
          <rect width="380" height="48" rx="10" fill="#27101C" stroke="#C77B9B" stroke-opacity=".4"/>
          <text class="p4-mono" x="14" y="20" font-size="10.5" fill="#F8F0F3">type Flatten&lt;T&gt; = T extends Array&lt;infer U&gt;</text>
          <text class="p4-mono" x="14" y="36" font-size="10.5" fill="#E5B5C7">  ? Flatten&lt;U&gt; : T;</text>
        </g>
        <!-- Layer 2: Mapped type -->
        <g transform="translate(20 106)">
          <rect width="380" height="48" rx="10" fill="#451126" stroke="#E5B5C7" stroke-opacity=".6"/>
          <text class="p4-mono" x="14" y="20" font-size="10.5" fill="#F8F0F3">type DeepReadonly&lt;T&gt; = {</text>
          <text class="p4-mono" x="14" y="36" font-size="10.5" fill="#F8F0F3">  readonly [K in keyof T]: DeepReadonly&lt;T[K]&gt;</text>
        </g>
        <!-- Layer 3: Discriminated Union Pattern -->
        <g transform="translate(20 168)">
          <rect width="380" height="48" rx="10" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/>
          <text class="p4-mono" x="14" y="20" font-size="10.5" fill="#F8F0F3">type Match&lt;T extends { tag: string }&gt; =</text>
          <text class="p4-mono" x="14" y="36" font-size="10.5" fill="#B6A3AC">  Extract&lt;T, { tag: 'success' }&gt;;</text>
        </g>
        <!-- Status indicator -->
        <g transform="translate(20 228)">
          <rect width="380" height="30" rx="8" fill="#10070C" stroke="#C77B9B" stroke-opacity=".3"/>
          <circle cx="18" cy="15" r="4" fill="#E5B5C7">
            <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <text class="p4-mono" x="32" y="19" font-size="10" fill="#B6A3AC">tsc --strict · Zero Any · Deterministic Compilation</text>
        </g>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p4-trace" style="animation-delay:-5.1s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>