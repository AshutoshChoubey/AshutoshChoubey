<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">AI Systems Lab: Planning, tool use and evaluation</title>
  <desc id="ai-desc">Conceptual Plan–Act–Reflect cycle covering tool integration, evaluation and human review.</desc>
  <defs>
    
    <linearGradient id="cyber-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B17"/>
      <stop offset=".45" stop-color="#0B172E"/>
      <stop offset="1" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="cyber-glow-cyan" cx="80%" cy="25%" r="65%">
      <stop offset="0" stop-color="#00C9FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00C9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyber-glow-blue" cx="20%" cy="80%" r="55%">
      <stop offset="0" stop-color="#1E40AF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyber-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset=".3" stop-color="#00C9FF"/>
      <stop offset=".7" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38BDF8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="cyber-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="ai-clip"><rect width="1200" height="290" rx="18"/></clipPath>
    <linearGradient id="wave-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C9FF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00C9FF" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="wave-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#059669" stop-opacity=".9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="wave-fill-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C9FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#060B17" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .trace-anim { stroke-dasharray: 620 2700; stroke-dashoffset: 3320; animation: trace 6.5s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .trace-anim { display: none; } }

    .ai-in { animation: ai-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    @keyframes ai-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ai-in { animation: none; } }
  </style>
  <g clip-path="url(#ai-clip)">
    <!-- Base Deep Obsidian Canvas -->
    <rect width="1200" height="290" fill="url(#cyber-bg)"/>
    <ellipse cx="600" cy="145" rx="460" ry="160" fill="url(#cyber-glow-cyan)"/>
    <rect width="1200" height="290" fill="url(#cyber-grid)"/>

    <!-- Continuous Horizontal Flowing Background Waves (Green and Cyan Blue) -->
    <g opacity="0.32">
      <!-- Wave 1: Flowing Cyan/Blue Wave -->
      <path fill="none" stroke="url(#wave-cyan)" stroke-width="2.2">
        <animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0 140 Q150 100 300 140 T600 140 T900 140 T1200 140;M0 140 Q150 180 300 140 T600 140 T900 140 T1200 140;M0 140 Q150 100 300 140 T600 140 T900 140 T1200 140"/>
      </path>
      <!-- Wave 2: Flowing Emerald Green Wave with Moving Dash Stream -->
      <path fill="none" stroke="url(#wave-green)" stroke-width="1.8" stroke-dasharray="14 10">
        <animate attributeName="d" dur="8.5s" repeatCount="indefinite" values="M0 155 Q200 195 400 155 T800 155 T1200 155;M0 155 Q200 115 400 155 T800 155 T1200 155;M0 155 Q200 195 400 155 T800 155 T1200 155"/>
        <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="8.5s" repeatCount="indefinite"/>
      </path>
    </g>

    
    <!-- Floating Lava Sparks & Energetic Embers -->
    <g class="lava-sparks">
      <!-- Emerald Green Sparks -->
      <circle cx="660" cy="250" r="2.2" fill="#34D399" filter="url(#cyber-glow)">
        <animate attributeName="cy" values="250;40" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.95;.0" dur="4.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="230" r="1.6" fill="#34D399">
        <animate attributeName="cy" values="230;30" dur="5.8s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.85;.0" dur="5.8s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Ruby Red Sparks -->
      <circle cx="780" cy="260" r="2" fill="#F43F5E" filter="url(#cyber-glow)">
        <animate attributeName="cy" values="260;50" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;.0" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1200" cy="240" r="1.8" fill="#F43F5E">
        <animate attributeName="cy" values="240;45" dur="6.1s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;.0" dur="6.1s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <!-- Electric Cyan Sparks -->
      <circle cx="580" cy="220" r="1.8" fill="#00C9FF">
        <animate attributeName="cy" values="220;35" dur="4.9s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;.0" dur="4.9s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="255" r="2.2" fill="#38BDF8" filter="url(#cyber-glow)">
        <animate attributeName="cy" values="255;60" dur="5.5s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.95;.0" dur="5.5s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <!-- Golden Amber Sparks -->
      <circle cx="940" cy="245" r="1.5" fill="#F59E0B">
        <animate attributeName="cy" values="245;55" dur="6.4s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.75;.0" dur="6.4s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  

    <!-- Top Section Header -->
    <g class="ai-in" style="animation-delay: 0.1s;">
      <text class="mono" x="56" y="38" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#38BDF8">02 · AI SYSTEMS / RESEARCH</text>
      <text class="sans" x="56" y="66" font-size="20" font-weight="700" fill="#F8FAFC">Intelligent Systems &amp; Agent Workflows</text>
      <line x1="56" y1="82" x2="1144" y2="82" stroke="#1E3A5F" stroke-opacity=".6"/>
    </g>

    <!-- Center Agentic Orchestration Cycle (Plan -> Act -> Reflect) -->
    <g class="ai-in" style="animation-delay: 0.25s;">
      <!-- Node 1: PLAN -->
      <g transform="translate(68 100)">
        <rect width="288" height="104" rx="12" fill="#0D1D33" stroke="#1E3A5F" stroke-width="1.2"/>
        <rect x="18" y="18" width="68" height="22" rx="11" fill="#061A23" stroke="#34D399" stroke-opacity=".5"/>
        <text class="mono" x="52" y="33" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">01 PLAN</text>
        <text class="sans" x="18" y="66" font-size="20" font-weight="700" fill="#F8FAFC">Goal &amp; Strategy</text>
        <text class="sans" x="18" y="88" font-size="12" fill="#94A3B8">Task decomposition &amp; context synthesis</text>
      </g>

      <!-- MOVING ARROW: Plan -> Act (Continuously Flowing Arrow & Chevron) -->
      <g>
        <line x1="368" y1="152" x2="438" y2="152" stroke="#34D399" stroke-width="2.2" stroke-dasharray="6 4">
          <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/>
        </line>
        <polygon points="446 152, 434 146, 437 152, 434 158" fill="#34D399">
          <animate attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="0.9s" repeatCount="indefinite"/>
        </polygon>
      </g>

      <!-- Node 2: ACT -->
      <g transform="translate(456 100)">
        <rect width="288" height="104" rx="12" fill="#0D1D33" stroke="#1E3A5F" stroke-width="1.2"/>
        <rect x="18" y="18" width="62" height="22" rx="11" fill="#0C2038" stroke="#38BDF8" stroke-opacity=".5"/>
        <text class="mono" x="49" y="33" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">02 ACT</text>
        <text class="sans" x="18" y="66" font-size="20" font-weight="700" fill="#F8FAFC">Tool Execution</text>
        <text class="sans" x="18" y="88" font-size="12" fill="#94A3B8">Model inference &amp; tool invocations</text>
      </g>

      <!-- MOVING ARROW: Act -> Reflect (Continuously Flowing Arrow & Chevron) -->
      <g>
        <line x1="756" y1="152" x2="826" y2="152" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="6 4">
          <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/>
        </line>
        <polygon points="834 152, 822 146, 825 152, 822 158" fill="#38BDF8">
          <animate attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="0.9s" repeatCount="indefinite"/>
        </polygon>
      </g>

      <!-- Node 3: REFLECT -->
      <g transform="translate(844 100)">
        <rect width="288" height="104" rx="12" fill="#0D1D33" stroke="#1E3A5F" stroke-width="1.2"/>
        <rect x="18" y="18" width="86" height="22" rx="11" fill="#241B0E" stroke="#F59E0B" stroke-opacity=".5"/>
        <text class="mono" x="61" y="33" font-size="10.5" font-weight="700" fill="#F59E0B" text-anchor="middle">03 REFLECT</text>
        <text class="sans" x="18" y="66" font-size="20" font-weight="700" fill="#F8FAFC">Self-Evaluation</text>
        <text class="sans" x="18" y="88" font-size="12" fill="#94A3B8">Validation, guardrails &amp; error recovery</text>
      </g>

      <!-- CONTINUOUS FLOWING REFLECTION LOOP: Reflect back to Plan -->
      <g>
        <path d="M988 204 C988 246, 212 246, 212 208" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6 4">
          <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.8s" repeatCount="indefinite"/>
        </path>
        <polygon points="212 205, 207 215, 217 215" fill="#F59E0B">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
        </polygon>
        <text class="mono" x="600" y="248" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.2" text-anchor="middle">ADAPTIVE RE-PLANNING &amp; CONTINUOUS FEEDBACK LOOP</text>
      </g>
    </g>

    <!-- Base Perimeter Border & Surrounding Radiant Corner Trace -->
    <rect x=".5" y=".5" width="1199" height="289" rx="17.5" fill="none" stroke="#1E3A5F" stroke-opacity=".4"/>
    <rect class="trace-anim" x=".5" y=".5" width="1199" height="289" rx="17.5" fill="none" stroke="url(#cyber-trace)" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
