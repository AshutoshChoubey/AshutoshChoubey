<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="t-title-part06">
  <title id="t-title-part06">PART 06 ENGINEERING ACTIVITY: Building in public.</title>
