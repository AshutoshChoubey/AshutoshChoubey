  <title id="title">engineering.ts and portrait.sh</title>
  <desc id="desc">Ashutosh's engineering.ts. Focus areas include System design and Project architecture. Frontend stack includes Angular, TypeScript, RxJS, NgRx. Research includes AI orchestration. ASCII character portrait of Ashutosh Kumar Choubey seated, drawn with asterisks, hash signs, and other coding symbols.</desc>
