  </defs>
  <style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .characters { animation: clear-portrait 20s ease-in-out infinite; }
    .portrait-window { transform-box: fill-box; transform-origin: top; animation: scan-portrait 20s steps(44) infinite; }
    @keyframes scan-portrait {
      0%, 2% { transform: scaleY(0); }
      16%, 100% { transform: scaleY(1); }
    }
    @keyframes clear-portrait {
      0%, 96% { opacity: 1; }
      99.5%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .characters, .portrait-window { animation: none; }
    }</style>
