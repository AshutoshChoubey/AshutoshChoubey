<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="288" viewBox="0 0 420 288" role="img" aria-labelledby="title desc">
<title id="title">Ashutosh Kumar Choubey — Founder, WorldGyan</title>
<desc id="desc">Engineer. Architect. Explore. Build. GitHub, LinkedIn, professional portfolio, WorldGyan and YouTube links are provided in the README.</desc>
<defs><clipPath id="frame-clip"><rect width="420" height="288" rx="18"/></clipPath><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1225"/><stop offset="1" stop-color="#122742"/></linearGradient><linearGradient id="signal"><stop stop-color="#1E40AF"/><stop offset=".52" stop-color="#00C9FF"/><stop offset="1" stop-color="#73DEFF"/></linearGradient><radialGradient id="ambient"><stop stop-color="#1E40AF" stop-opacity=".28"/><stop offset="1" stop-color="#1E40AF" stop-opacity="0"/></radialGradient><linearGradient id="ink"><stop stop-color="#0B1225"/><stop offset="1" stop-color="#1E40AF"/></linearGradient><linearGradient id="card" x2=".7" y2="1"><stop stop-color="#1A304C"/><stop offset="1" stop-color="#101E34"/></linearGradient><linearGradient id="orchestrator" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#194578"/><stop offset=".55" stop-color="#173957"/><stop offset="1" stop-color="#14243D"/></linearGradient><radialGradient id="cyan-halo"><stop stop-color="#00C9FF" stop-opacity=".19"/><stop offset="1" stop-color="#00C9FF" stop-opacity="0"/></radialGradient><radialGradient id="paper-light"><stop stop-color="#DCEBFA" stop-opacity=".65"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient><pattern id="blueprint" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#345170" stroke-width=".5"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.trace{stroke-dasharray:1100;stroke-dashoffset:0;animation:trace 3.2s ease-out 1}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 4s ease-in-out 1}.assemble{animation:assemble 2.4s ease-out 1}.layer-1{animation:assemble 2.5s ease-out .3s 1}.layer-2{animation:assemble 2.7s ease-out .6s 1}.role-enter{animation:role-enter 2.2s ease-out .3s 1}.card-enter{animation:card-enter 2s ease-out 1}.step-1{animation:card-enter 2s ease-out .25s 1}.step-2{animation:card-enter 2s ease-out .5s 1}.step-3{animation:card-enter 2s ease-out .75s 1}.halo-orbit{transform-origin:0 0;animation:halo-orbit 4s ease-in-out 1}.beacon{animation:beacon 3.8s ease-out 1}.rise{animation:rise 1.1s ease-out .15s 1}.aurora{transform-box:fill-box;transform-origin:center;animation:aurora 3.4s ease-out 1}.signal{stroke-dasharray:12 540;animation:signal 3.8s ease-out 1}@keyframes role-enter{from{transform:translateY(12px);opacity:.6}to{transform:translateY(0);opacity:1}}@keyframes card-enter{from{transform:translateY(18px);opacity:.35}to{transform:translateY(0);opacity:1}}@keyframes halo-orbit{from{transform:rotate(-150deg)}to{transform:rotate(0)}}@keyframes beacon{0%{r:4;opacity:.3}35%{r:15;opacity:.8}70%{r:5;opacity:.4}100%{r:10;opacity:1}}@keyframes assemble{from{transform:translateY(32px);opacity:.25}to{transform:translateY(0);opacity:1}}@keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes orbit{from{transform:rotate(-14deg)}to{transform:rotate(0)}}@keyframes rise{from{transform:translateY(8px);opacity:.78}to{transform:translateY(0);opacity:1}}@keyframes aurora{from{transform:scale(.97);opacity:.55}to{transform:scale(1);opacity:1}}@keyframes signal{from{stroke-dashoffset:552}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace,.orbit,.rise,.aurora,.signal,.assemble,.role-enter,.card-enter,.halo-orbit,.beacon{animation:none!important}}</style>
<rect x="0" y="0" width="420" height="288" rx="18" fill="#FFFFFF" />
<g clip-path="url(#frame-clip)"><path d="M188 42H232V42" fill="none" stroke="#F59E0B" stroke-width="2"/><text x="210" y="103" font-size="25" fill="#0B1225" font-weight="600" text-anchor="middle">Ashutosh Kumar Choubey</text><text x="210" y="137" font-size="18" text-anchor="middle"><tspan fill="#526179">Founder, </tspan><tspan fill="#000000" font-weight="700">World</tspan><tspan fill="#C65A0A" font-weight="700">Gyan</tspan></text><path d="M179 164H241V164" fill="none" stroke="#345170" /><text x="210" y="210" font-size="23" fill="#0B1225" font-weight="700" letter-spacing="1.2" text-anchor="middle">ENGINEER. ARCHITECT.</text><text x="210" y="244" font-size="23" fill="#1E40AF" font-weight="700" letter-spacing="1.2" text-anchor="middle">EXPLORE. BUILD.</text></g>
