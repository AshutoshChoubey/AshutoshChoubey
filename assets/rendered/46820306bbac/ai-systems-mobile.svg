<g clip-path="url(#frame-clip)"><ellipse class="aurora" cx="273" cy="257.6" rx="147" ry="386.4" fill="url(#cyan-halo)"/><rect width="420" height="644" fill="url(#blueprint)" opacity=".16"/><text x="28" y="35" font-size="12" fill="#A8B7CC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="1.8" >03 / AI ARCHITECTURE / RESEARCH</text><path d="M28 52H392V52" fill="none" stroke="#283950" /><circle cx="392" cy="34" r="3" fill="#F59E0B"/><text x="28" y="98" font-size="29" fill="#FFFFFF" font-weight="600">AI architecture.</text><text x="28" y="132" font-size="29" fill="#73DEFF" font-weight="600">Intelligent systems.</text><text x="28" y="162" font-size="12" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="1.8" >CONCEPTUAL / EXPLORING</text><rect x="28" y="188" width="364" height="68" rx="14" fill="#050D1C" opacity=".2"/><rect x="28" y="185" width="364" height="68" rx="14" fill="url(#card)" stroke="#3D5878" stroke-opacity=".65"/><path d="M43 186H377" stroke="#D0E8FF" stroke-opacity=".12"/><text x="48" y="214" font-size="21" fill="#FFFFFF" font-weight="600">Intent &amp; context</text><text x="48" y="239" font-size="15" fill="#B7C9DE" >Goals · retrieval · boundaries</text><path class="trace" d="M210 253V284" fill="none" stroke="url(#signal)" stroke-width="2" stroke-linecap="round"/><path d="M210 253V284" fill="none" stroke="#64DAFF" class="signal" stroke-width="2.4" stroke-linecap="round"/><rect x="28" y="284" width="364" height="128" rx="14" fill="url(#orchestrator)" stroke="#5BB6E3"/><text x="48" y="311" font-size="12" fill="#A5E4FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="1.8" >AGENTIC AI</text><text x="48" y="345" font-size="27" fill="#FFFFFF" font-weight="600">AI Orchestration</text><text x="48" y="373" font-size="18" fill="#D8EEFA" >Plan  →  Act  →  Reflect</text><g transform="translate(354 309)"><circle class="beacon" r="8" fill="none" stroke="#73DEFF"/><circle r="3" fill="#73DEFF"/></g><text x="48" y="397" font-size="15" fill="#B7C9DE" >LLMs · tool contracts · workflow state</text><path class="trace" d="M210 412V439" fill="none" stroke="url(#signal)" stroke-width="2" stroke-linecap="round"/><path d="M210 412V439" fill="none" stroke="#64DAFF" class="signal" stroke-width="2.4" stroke-linecap="round"/><rect x="28" y="442" width="364" height="66" rx="14" fill="#050D1C" opacity=".2"/><rect x="28" y="439" width="364" height="66" rx="14" fill="url(#card)" stroke="#3D5878" stroke-opacity=".65"/><path d="M43 440H377" stroke="#D0E8FF" stroke-opacity=".12"/><text x="48" y="469" font-size="21" fill="#FFFFFF" font-weight="600">Tools &amp; knowledge</text><text x="48" y="493" font-size="15" fill="#B7C9DE" >MCP · APIs · grounded context</text><path class="trace" d="M210 505V532" fill="none" stroke="url(#signal)" stroke-width="2" stroke-linecap="round"/><path d="M210 505V532" fill="none" stroke="#64DAFF" class="signal" stroke-width="2.4" stroke-linecap="round"/><rect x="28" y="535" width="364" height="66" rx="14" fill="#050D1C" opacity=".2"/><rect x="28" y="532" width="364" height="66" rx="14" fill="url(#card)" stroke="#3D5878" stroke-opacity=".65"/><path d="M43 533H377" stroke="#D0E8FF" stroke-opacity=".12"/><text x="48" y="562" font-size="21" fill="#FFFFFF" font-weight="600">Evaluate &amp; review</text><text x="48" y="586" font-size="15" fill="#B7C9DE" >Quality · observability · human decisions</text><text x="28" y="628" font-size="15" fill="#A8B7CC" >Research direction · learning in progress</text></g>
