<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="492" viewBox="0 0 420 492" role="img" aria-labelledby="title desc">
<title id="title">Core technologies: Angular, TypeScript, JavaScript, RxJS, NgRx</title>
<desc id="desc">HTML5 · CSS3 / SCSS · Component Architecture. Supporting: Node.js / REST APIs, Jasmine / Jest, Git / CI/CD. Accessibility · Security · Automated Testing.</desc>
<defs><clipPath id="frame-clip"><rect width="420" height="492" rx="18"/></clipPath><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1225"/><stop offset="1" stop-color="#122742"/></linearGradient><linearGradient id="signal"><stop stop-color="#1E40AF"/><stop offset=".52" stop-color="#00C9FF"/><stop offset="1" stop-color="#73DEFF"/></linearGradient><radialGradient id="ambient"><stop stop-color="#1E40AF" stop-opacity=".28"/><stop offset="1" stop-color="#1E40AF" stop-opacity="0"/></radialGradient><linearGradient id="ink"><stop stop-color="#0B1225"/><stop offset="1" stop-color="#1E40AF"/></linearGradient><linearGradient id="card" x2=".7" y2="1"><stop stop-color="#1A304C"/><stop offset="1" stop-color="#101E34"/></linearGradient><linearGradient id="orchestrator" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#194578"/><stop offset=".55" stop-color="#173957"/><stop offset="1" stop-color="#14243D"/></linearGradient><radialGradient id="cyan-halo"><stop stop-color="#00C9FF" stop-opacity=".19"/><stop offset="1" stop-color="#00C9FF" stop-opacity="0"/></radialGradient><radialGradient id="paper-light"><stop stop-color="#DCEBFA" stop-opacity=".65"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient><pattern id="blueprint" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#345170" stroke-width=".5"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.trace{stroke-dasharray:1100;stroke-dashoffset:0;animation:trace 3.2s ease-out 1}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 4s ease-in-out 1}.assemble{animation:assemble 2.4s ease-out 1}.layer-1{animation:assemble 2.5s ease-out .3s 1}.layer-2{animation:assemble 2.7s ease-out .6s 1}.role-enter{animation:role-enter 2.2s ease-out .3s 1}.card-enter{animation:card-enter 2s ease-out 1}.step-1{animation:card-enter 2s ease-out .25s 1}.step-2{animation:card-enter 2s ease-out .5s 1}.step-3{animation:card-enter 2s ease-out .75s 1}.ai-glow{animation:ai-glow 4s ease-in-out 1}.architecture-drift{animation:architecture-drift 4s ease-in-out 1}.system-orbit{transform-box:fill-box;transform-origin:center;animation:system-orbit 4s ease-in-out 1}.halo-orbit{transform-origin:0 0;animation:halo-orbit 4s ease-in-out 1}.beacon{animation:beacon 3.8s ease-out 1}.rise{animation:rise 1.1s ease-out .15s 1}.aurora{transform-box:fill-box;transform-origin:center;animation:aurora 3.4s ease-out 1}.signal{stroke-dasharray:12 540;animation:signal 3.8s ease-out 1}@keyframes role-enter{from{transform:translateY(12px);opacity:.6}to{transform:translateY(0);opacity:1}}@keyframes card-enter{from{transform:translateY(18px);opacity:.35}to{transform:translateY(0);opacity:1}}@keyframes ai-glow{0%{fill:#73DEFF}25%{fill:#FFFFFF}50%{fill:#F8BF5C}75%{fill:#FFFFFF}100%{fill:#73DEFF}}@keyframes architecture-drift{0%{transform:translateY(18px);opacity:.4}45%{transform:translateY(-8px);opacity:1}75%{transform:translateY(4px)}100%{transform:translateY(0);opacity:1}}@keyframes system-orbit{from{transform:rotate(-85deg)}to{transform:rotate(0)}}@keyframes halo-orbit{from{transform:rotate(-150deg)}to{transform:rotate(0)}}@keyframes beacon{0%{r:4;opacity:.3}35%{r:15;opacity:.8}70%{r:5;opacity:.4}100%{r:10;opacity:1}}@keyframes assemble{from{transform:translateY(32px);opacity:.25}to{transform:translateY(0);opacity:1}}@keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes orbit{from{transform:rotate(-14deg)}to{transform:rotate(0)}}@keyframes rise{from{transform:translateY(8px);opacity:.78}to{transform:translateY(0);opacity:1}}@keyframes aurora{from{transform:scale(.97);opacity:.55}to{transform:scale(1);opacity:1}}@keyframes signal{from{stroke-dashoffset:552}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace,.orbit,.rise,.aurora,.signal,.assemble,.role-enter,.card-enter,.halo-orbit,.system-orbit,.beacon,.ai-glow,.architecture-drift{animation:none!important}}</style>
