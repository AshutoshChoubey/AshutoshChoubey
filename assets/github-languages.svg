<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 383" width="1200" height="383" role="img" aria-labelledby="title desc">
<title id="title">Technology focus</title>
<desc id="desc">Technology focus cycles through JavaScript (primary), TypeScript (primary), Angular (frontend), RxJS (reactive), Python (supporting), Agentic AI (exploring). Most emphasis goes to JavaScript and TypeScript. Slice size shows relative emphasis.</desc>
